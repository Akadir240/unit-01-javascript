<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let bill = parseFloat(prompt("What is the bill amount?"));
        let tip = parseFloat(prompt("What is the tip?"))
        let people = parseFloat(prompt("How many people?"))
        let total = bill + (1 + tip/ 100) 
        alert ("Total: " + total.toFixed(2) + 
        "\nPer Person: " + (total / people).toFixed(2))
    </script>
</body>
</html>
