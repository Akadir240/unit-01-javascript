<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let raw = "  jOHN smith ";

    let clean = raw.trim().toLowerCase();   // 1. remove the extra spaces, make it all lowercase
    console.log(clean);  
    let space = clean.indexOf(' ');   // 2. find the space between the names
    console.log(space);
    let first = clean.slice(0, space);   // 3. cut out the first name
    console.log(first)
    let last  =clean.slice(space + 1);   // 4. cut out the last name
    console.log(last);
    first = first.charAt(0).toUpperCase() + first.slice(1);   // 5. capitalize each one
    console.log(first);
    last  = last.charAt(0).toUpperCase() + last.slice(1);
    console.log(last);
    console.log(last + ", " + first);  // 6. print "Last, First"
    
    
    

    </script>
</body>
</html>
