// Core 1: Create an object named student with three properties:
//   name (a string), grade (a number), and scores (an array of three test scores).

let student = {
    name: "Akadir",
    grade: 12,
    scores: [90, 85, 92],
    describe: function() {
        return this.name + " is in grade " + this.grade;
    }, 
    getHighest: function() {
        return Math.max(...this.scores);
    },
    addBonus: function(points) {
        this.scores[0] += points;
    },
    getLetter: function() {
        let highestScore = this.getHighest();
        if (highestScore >= 90) {
            return "A";
        } else if (highestScore >= 80) {
            return "B";
        } else if (highestScore >= 70) {
            return "C";
        } else if (highestScore >= 60) {
            return "D";
        } else {
            return "F";
        }
    }
};
