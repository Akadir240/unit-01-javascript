<body>
    <script>
        let score = 10;              // 10
score += 5;                  // 15
score *= 2;                  // 30
let bonus = score % 7;       // 2
score -= bonus;              // 28
let old = ++score;           // 29
let next = ++score;          // 30
score /= 3;                  // 10
bonus--;                     // 1
score = score + bonus * 4;   // 14

// 1. Why is old 28 but score 29 after line 6?
// A: Old is 28 because of (scoure++) but score is 29 because of the (++score) which adds 1 to the score after.
// 2. Why doesn’t line 10 give 44?
// A: Line 10 doesnt give 44 because the score is 10 and the bonus is 1 so 10 + 1 * 4 = 14.
// 3. What would score be if line 3 came before line 2?
// A: 20
        console.log(score, bonus, old, next);

    </script>
