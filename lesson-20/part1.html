// STEP 1: Student constructor with validation
// Write a constructor function Student(name, scores).


function Student(name, scores) {
this.name = name;
 this.scores = scores;
 for (let score of scores) {
    if (typeof score !== "number" || score < 0 || score > 100) {
        throw new Error("Invalid score for " + name + ": " + score);
    }
}
this.getAverage = function() {
    let total = 0;
    for (let score of scores) {
        total += score;
    }
    return total / scores.length;
}
}
let roster = [];

} catch (err) {

}

function getLetter(average) {
    if (average >= 90) {
        return "A";
    } else if (average >= 80) {
        return "B";
    } else if (average >= 70) {
        return "C";
    } else if (average >= 60) {
        return "D";
    } else {
        return "F";
    }
}

function findHighest(list) {
    let highestStudent = list[0];
    for (let student of list) {
        if (student.getAverage() > highestStudent.getAverage()) {
            highestStudent = student;
        }
    }
    return highestStudent;
}

function findLowest(list) {
    let lowestStudent = list[0];
    for (let student of list) {
        if (student.getAverage() < lowestStudent.getAverage()) {
            lowestStudent = student;
        }
    }
    return lowestStudent;
}

function sortByAverage(list) {
    list.sort((a, b) => b.getAverage() - a.getAverage());
}
function printReport(list) {
    console.log(new Date().toLocaleDateString("en-US"));
    for (let i = 0; i < list.length; i++) {
        let student = list[i];
        console.log(`${i + 1}. ${student.name}: ${student.getAverage().toFixed(1)}`);
    }
    let highestStudent = findHighest(list);
    let lowestStudent = findLowest(list);
    console.log(`Highest: ${highestStudent.name} with average ${highestStudent.getAverage().toFixed(1)}`);
    console.log(`Lowest: ${lowestStudent.name} with average ${lowestStudent.getAverage().toFixed(1)}`);
}

sortByAverage(roster);
printReport(roster);
